[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
frontier-sort = { path = "crates/sort" }
frontier-ebcdic = { path = "crates/ebcdic" }
frontier-copybook = { path = "crates/copybook" }
frontier-jcl = { path = "crates/jcl" }
frontier-adapter = { path = "crates/adapter" }
