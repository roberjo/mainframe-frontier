name: Dependabot auto-merge

# Turns on auto-merge for Dependabot PRs unless they contain a major version bump.
# GitHub merges only after the branch protection's required checks pass;
# majors stay open for manual review.
#
# Uses the GraphQL mutation rather than `gh pr merge --auto`: when nothing is
# pending, gh merges immediately, while the mutation refuses. So without
# required checks on main this job fails instead of merging untested PRs.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          gh api graphql -f id="$PR_ID" -f query='
            mutation($id: ID!) {
              enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) {
                clientMutationId
              }
            }'
        env:
          PR_ID: ${{ github.event.pull_request.node_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
