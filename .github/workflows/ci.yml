name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  batch:
    name: COBOL build + nightly batch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build dev image (Rust + GnuCOBOL 3.2)
        run: docker compose build
      - name: Compile, SETUP, two nightly cycles (month-end included)
        run: docker compose run --rm frontier make demo ACCOUNTS=2000 TXNS=10000
      - name: Upload job spool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spool
          path: var/spool
